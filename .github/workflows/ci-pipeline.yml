name: Continuous Integration Pipeline

on:
    push:
        branches: ["main"]

env:
    CONTAINER: ld-iam-db

jobs:
    build-and-push:
        name: Build & Push Docker Image
        if: github.event_name == 'push'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Set Up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Conainer Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ghcr.io/${{ github.repository_owner }}/${{ env.CONTAINER }}
                tags: |
                  type=sha,format=long
                  type=raw,value=latest,enable={{is_default_branch}}

            - name: Build & Push Docker Image
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ghcr.io/${{ github.repository_owner }}/${{ env.CONTAINER }}:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max

    test-database:
        name: Test Database Container
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Login to GitHub Conainer Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull and Start SQL Server Container
              run: |
                IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ env.CONTAINER }}:latest"

                docker pull $IMAGE_TAG

                docker run -d --name test-db -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=strongestAvangerPassword01" $IMAGE_TAG

            - name: Run Validation Query
              run: |
                docker exec test-db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SuperStrong!Pass123" -C -Q "SELECT @@VERSION"